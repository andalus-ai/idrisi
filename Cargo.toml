[workspace]
members = ["crates/idrisi-api"]
resolver = "2"

[workspace.package]
edition = "2021"
publish = false

[workspace.dependencies]
axum = "0.8"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
