# Local development only. Put public ingress behind Iket in deployed environments.
services:
  postgis:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-idrisi}
      POSTGRES_USER: ${POSTGRES_USER:-idrisi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-idrisi_dev_only_change_me}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgis_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-idrisi} -d ${POSTGRES_DB:-idrisi}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  idrisi-api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-idrisi}:${POSTGRES_PASSWORD:-idrisi_dev_only_change_me}@postgis:5432/${POSTGRES_DB:-idrisi}
      IDRISI_API_BIND: 0.0.0.0:8080
      RUST_LOG: ${RUST_LOG:-info}
    ports:
      - "127.0.0.1:${IDRISI_API_PORT:-8080}:8080"
    depends_on:
      postgis:
        condition: service_healthy
    restart: unless-stopped

  martin:
    image: ghcr.io/maplibre/martin:v0.17.0
    command:
      - postgres://${POSTGRES_USER:-idrisi}:${POSTGRES_PASSWORD:-idrisi_dev_only_change_me}@postgis:5432/${POSTGRES_DB:-idrisi}
    ports:
      - "127.0.0.1:${MARTIN_PORT:-3000}:3000"
    depends_on:
      postgis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgis_data:
