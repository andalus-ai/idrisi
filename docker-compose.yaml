services:
  postgres:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-idrisi}
      POSTGRES_USER: ${POSTGRES_USER:-idrisi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-idrisi_dev_only_change_me}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    networks:
      - idrisi-internal
    volumes:
      - idrisi-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-idrisi} -d ${POSTGRES_DB:-idrisi}"]
      interval: 10s
      timeout: 5s
      retries: 5

  idrisi-api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      IDRISI_API_BIND: 0.0.0.0:8080
      DATABASE_URL: postgres://${POSTGRES_USER:-idrisi}:${POSTGRES_PASSWORD:-idrisi_dev_only_change_me}@postgres:5432/${POSTGRES_DB:-idrisi}
      RUST_LOG: ${RUST_LOG:-info}
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "8080"
    networks:
      - idrisi-internal
    ports:
      - "127.0.0.1:8080:8080"

volumes:
  idrisi-postgres:

networks:
  idrisi-internal:
    name: idrisi-internal
