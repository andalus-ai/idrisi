name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  rust:
    name: Rust checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Prepare local Compose environment
        run: cp .env.example .env
      - name: Compose config
        run: docker compose -f compose.yaml config --quiet
      - name: PostGIS migration and publication privilege gates
        run: bash scripts/integration/postgis-publication-gates.sh
      - name: Ingestion and smoke-test script syntax
        run: |
          bash -n scripts/ingest/osm-bandung.sh
          bash -n scripts/smoke/test-vector-tiles.sh
          bash -n scripts/integration/postgis-publication-gates.sh
      - name: TypeScript SDK
        working-directory: sdks/typescript
        run: |
          npm install --no-audit --no-fund
          npm test
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Test
        run: cargo test --workspace
