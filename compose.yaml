# Canonical local/self-hosted Compose deployment.
# Public ingress belongs in Iket; only the API and reference viewer bind to loopback.
services:
  postgres:
    image: postgis/postgis:16-3.5
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-idrisi}
      POSTGRES_USER: ${POSTGRES_USER:-idrisi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      MARTIN_DB_PASSWORD: ${MARTIN_DB_PASSWORD:?Set MARTIN_DB_PASSWORD in .env}
      IDRISI_INGEST_DB_PASSWORD: ${IDRISI_INGEST_DB_PASSWORD:?Set IDRISI_INGEST_DB_PASSWORD in .env}
      IDRISI_PUBLISH_DB_PASSWORD: ${IDRISI_PUBLISH_DB_PASSWORD:?Set IDRISI_PUBLISH_DB_PASSWORD in .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    networks:
      - idrisi-internal
    volumes:
      - idrisi-postgres:/var/lib/postgresql/data
      - ./infrastructure/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-idrisi} -d ${POSTGRES_DB:-idrisi}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  idrisi-api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      IDRISI_API_BIND: 0.0.0.0:8080
      DATABASE_URL: postgres://${POSTGRES_USER:-idrisi}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-idrisi}
      RUST_LOG: ${RUST_LOG:-info}
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "8080"
    ports:
      - "127.0.0.1:${IDRISI_API_PORT:-8080}:8080"
    networks:
      - idrisi-internal

  idrisi-worker:
    build:
      context: .
      dockerfile: Dockerfile
    entrypoint: ["/usr/local/bin/idrisi-worker"]
    restart: unless-stopped
    stop_grace_period: 30s
    environment:
      DATABASE_URL: postgres://idrisi_ingest:${IDRISI_INGEST_DB_PASSWORD}@postgres:5432/${POSTGRES_DB:-idrisi}
      IDRISI_WORKER_DATA_DIR: /var/lib/idrisi/ingestion
      IDRISI_WORKER_ALLOWED_HOSTS: ${IDRISI_WORKER_ALLOWED_HOSTS:-download.geofabrik.de}
      IDRISI_WORKER_MAX_SOURCE_BYTES: ${IDRISI_WORKER_MAX_SOURCE_BYTES:-21474836480}
      IDRISI_WORKER_POLL_SECONDS: ${IDRISI_WORKER_POLL_SECONDS:-5}
      IDRISI_WORKER_LEASE_SECONDS: ${IDRISI_WORKER_LEASE_SECONDS:-300}
      IDRISI_WORKER_HEARTBEAT_SECONDS: ${IDRISI_WORKER_HEARTBEAT_SECONDS:-30}
      IDRISI_WORKER_REQUEST_TIMEOUT_SECONDS: ${IDRISI_WORKER_REQUEST_TIMEOUT_SECONDS:-14400}
      IDRISI_OSMIUM_PATH: ${IDRISI_OSMIUM_PATH:-/usr/bin/osmium}
      IDRISI_WORKER_INSPECTION_TIMEOUT_SECONDS: ${IDRISI_WORKER_INSPECTION_TIMEOUT_SECONDS:-1800}
      IDRISI_OSM2PGSQL_PATH: ${IDRISI_OSM2PGSQL_PATH:-/usr/bin/osm2pgsql}
      IDRISI_OSM_STYLE_PATH: ${IDRISI_OSM_STYLE_PATH:-/opt/idrisi/osm2pgsql/bandung.lua}
      IDRISI_WORKER_IMPORT_TIMEOUT_SECONDS: ${IDRISI_WORKER_IMPORT_TIMEOUT_SECONDS:-21600}
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: ${POSTGRES_DB:-idrisi}
      PGUSER: idrisi_ingest
      PGPASSWORD: ${IDRISI_INGEST_DB_PASSWORD}
      RUST_LOG: ${RUST_LOG:-info}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - idrisi-ingestion-data:/var/lib/idrisi/ingestion
    networks:
      - idrisi-internal

  idrisi-publisher:
    build:
      context: .
      dockerfile: Dockerfile
    entrypoint: ["/usr/local/bin/idrisi-publisher"]
    restart: unless-stopped
    stop_grace_period: 30s
    environment:
      DATABASE_URL: postgres://idrisi_publish:${IDRISI_PUBLISH_DB_PASSWORD}@postgres:5432/${POSTGRES_DB:-idrisi}
      IDRISI_PUBLISHER_POLL_SECONDS: ${IDRISI_PUBLISHER_POLL_SECONDS:-5}
      IDRISI_PUBLISHER_LEASE_SECONDS: ${IDRISI_PUBLISHER_LEASE_SECONDS:-300}
      IDRISI_PUBLISHER_HEARTBEAT_SECONDS: ${IDRISI_PUBLISHER_HEARTBEAT_SECONDS:-30}
      RUST_LOG: ${RUST_LOG:-info}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - idrisi-internal

  martin:
    image: ghcr.io/maplibre/martin:1.16.1
    restart: unless-stopped
    environment:
      MARTIN_DATABASE_URL: postgres://martin_tiles:${MARTIN_DB_PASSWORD}@postgres:5432/${POSTGRES_DB:-idrisi}
    command: ["--config", "/config/martin.yaml"]
    volumes:
      - ./infrastructure/martin/martin.yaml:/config/martin.yaml:ro
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "3000"
    networks:
      - idrisi-internal

  map-viewer:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - martin
    volumes:
      - ./examples/maplibre:/usr/share/nginx/html:ro
    ports:
      - "127.0.0.1:${MAP_VIEWER_PORT:-8090}:80"
    networks:
      - idrisi-internal

volumes:
  idrisi-postgres:
  idrisi-ingestion-data:

networks:
  idrisi-internal:
    name: idrisi-internal
